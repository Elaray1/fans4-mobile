  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
        
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://${{ secrets.PAT_TOKEN }}@github.com/".insteadOf ssh://git@github.com/
      
      - name: Cache npm modules
        uses: actions/cache@v2
        id: cache-npm
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Install npm dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@v2
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pod dependencies
        run: |
          cd ios
          pod install

      - name: Install gpg
        run: brew install gnupg


      - name: Setup provisioning profile
        run: sh ./.github/secrets/decrypt_secrets.sh
        env:
          IOS_PROFILE_KEY: ${{ secrets.GPG_PASS }}
          IOS_CERT_PASS: ${{ secrets.CERTIFICATE_PASS }}

      - name: Build app
        run: |
          cd ios
          xcodebuild -workspace fans4.xcworkspace -scheme fans4-staging archive -archivePath fans4-staging.xcarchive -allowProvisioningUpdates PROVISIONING_PROFILE="40818aae-aee5-4efd-93ff-8783558108ed"
          xcodebuild -exportArchive -archivePath ./fans4-staging.xcarchive -exportPath . -exportOptionsPlist fans4/Info.plist

      - name: Upload Artifact
        uses: actions/upload-artifact@v1
        with:
          name: fans4.ipa
          path: ios/


      - name: Distribute app via Firebase App Distribution
        env:
          firebaseToken: ${{ secrets.FIREBASE_TOKEN }}
          firebaseGroups: ${{ secrets.FIREBASE_IOS_GROUPS }}
          firebaseAppId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          notes: ${{ github.event.head_commit.message }}
        run: |
          yarn global add firebase-tools
          export PATH="$(yarn global bin):$PATH"
          firebase \
            appdistribution:distribute ios/fans4.ipa \
            --app $firebaseAppId \
            --release-notes "$notes" \
            --groups "$firebaseGroups" \
            --token "$firebaseToken"

